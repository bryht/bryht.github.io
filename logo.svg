<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Bryht Tech red star">
  <defs>
    <linearGradient id="starLight" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FF7059"/>
      <stop offset="1" stop-color="#E2492F"/>
    </linearGradient>
    <linearGradient id="starDark" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#C23A2A"/>
      <stop offset="1" stop-color="#8E2418"/>
    </linearGradient>
    <radialGradient id="starCore" cx="0.42" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#FF8a72" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FF8a72" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Lit facets (left side of each arm) -->
  <g fill="url(#starLight)">
    <path d="M50 50 38.83 34.63 50 2 Z"/>
    <path d="M50 50 61.17 34.63 95.65 35.17 Z"/>
    <path d="M50 50 68.07 55.87 78.21 88.83 Z"/>
    <path d="M50 50 50 69 21.79 88.83 Z"/>
    <path d="M50 50 31.93 55.87 4.35 35.17 Z"/>
  </g>

  <!-- Shadowed facets (right side of each arm) -->
  <g fill="url(#starDark)">
    <path d="M50 50 50 2 61.17 34.63 Z"/>
    <path d="M50 50 95.65 35.17 68.07 55.87 Z"/>
    <path d="M50 50 78.21 88.83 50 69 Z"/>
    <path d="M50 50 21.79 88.83 31.93 55.87 Z"/>
    <path d="M50 50 4.35 35.17 38.83 34.63 Z"/>
  </g>

  <!-- Soft central highlight for depth -->
  <path d="M50 2 61.17 34.63 95.65 35.17 68.07 55.87 78.21 88.83 50 69 21.79 88.83 31.93 55.87 4.35 35.17 38.83 34.63 Z" fill="url(#starCore)"/>

  <!-- Crisp outer edge -->
  <path d="M50 2 61.17 34.63 95.65 35.17 68.07 55.87 78.21 88.83 50 69 21.79 88.83 31.93 55.87 4.35 35.17 38.83 34.63 Z"
        fill="none" stroke="#7C1E12" stroke-width="0.8" stroke-linejoin="round"/>
</svg>
